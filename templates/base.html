<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Fusion Tech Dynamics — end-to-end engineering: embedded hardware, edge AI, test & simulation platforms, industrial automation, and full-stack software." />
  <title>{% block title %}Fusion Tech Dynamics{% endblock %}</title>
  {%- set _site = 'https://fusiontechdynamics.com' %}
  {%- set _url = _site + request.path %}
  <link rel="canonical" href="{{ _url }}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Fusion Tech Dynamics" />
  <meta property="og:url" content="{{ _url }}" />
  <meta property="og:title" content="{{ self.title() }}" />
  <meta property="og:description" content="Fusion Tech Dynamics — end-to-end engineering: embedded hardware, edge AI, test &amp; simulation platforms, industrial automation, and full-stack software." />
  <meta property="og:image" content="{{ _site }}/static/images/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ self.title() }}" />
  <meta name="twitter:description" content="Fusion Tech Dynamics — end-to-end engineering: embedded hardware, edge AI, test &amp; simulation platforms, industrial automation, and full-stack software." />
  <meta name="twitter:image" content="{{ _site }}/static/images/og-image.png" />
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Fusion Tech Dynamics","url":"https://fusiontechdynamics.com/","logo":"https://fusiontechdynamics.com/static/images/logo-mark.png","email":"contact@fusiontechdynamics.com","telephone":"+92-347-5370806","address":{"@type":"PostalAddress","addressLocality":"Islamabad","addressCountry":"PK"},"sameAs":["https://www.linkedin.com/company/130384269/"]}</script>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', v=asset_version) }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>

  {% include "header.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "footer.html" %}

  <script src="{{ url_for('static', filename='js/script.js', v=asset_version) }}"></script>
</body>
</html>
