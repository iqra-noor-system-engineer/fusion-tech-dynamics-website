<header class="navbar">
  <div class="navbar-container">
    <div class="logo">
      <a href="/" class="logo-link" aria-label="Fusion Tech Dynamics home">
        <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
          <polygon points="32,6 53,18 53,46 32,58 11,46 11,18" fill="none" stroke="url(#logoGrad)" stroke-width="4"/>
          <path d="M32 19 L43 45 L32 38 L21 45 Z" fill="url(#logoGrad)"/>
        </svg>
        <span class="logo-word"><span class="lw-main">FUSION TECH</span><span class="lw-sub">DYNAMICS</span></span>
      </a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-menu" id="navMenu">
      {% set current = request.endpoint %}
      <ul class="nav-links">
        <li><a href="{{ url_for('home') }}" class="{% if current == 'home' %}active{% endif %}">Home</a></li>
        <li><a href="{{ url_for('about') }}" class="{% if current == 'about' %}active{% endif %}">About</a></li>
        <li><a href="{{ url_for('services') }}" class="{% if current == 'services' %}active{% endif %}">Services</a></li>
        <li><a href="{{ url_for('products') }}" class="{% if current == 'products' %}active{% endif %}">Products</a></li>
        <li><a href="/training" class="{% if current == 'training' %}active{% endif %}">Training</a></li>
        <li><a href="/careers" class="{% if current == 'careers' %}active{% endif %}">Careers</a></li>
        <li><a href="{{ url_for('contact') }}" class="{% if current == 'contact' %}active{% endif %}">Contact</a></li>
      </ul>
      <a href="/contact" class="btn-primary nav-cta-mobile">Request a Quote</a>
    </nav>
    <div class="cta">
      <a href="/contact" class="btn-primary">Request a Quote</a>
    </div>
  </div>
</header>
