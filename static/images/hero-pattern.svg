    <circle cx="560" cy="180" r="4"/>
    <circle cx="420" cy="250" r="4"/>
    <circle cx="700" cy="290" r="4"/>
    <circle cx="320" cy="470" r="4"/>
    <circle cx="520" cy="400" r="4"/>
